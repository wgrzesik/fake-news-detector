defaults:
  - _self_

seed: 42
base_data_dir: "research/configs/datasets/processed"

# Resume training after disconnection (e.g. Google Colab timeout).
# Completed experiments are detected from experiments/metrics/training_results.csv.
# Transformer epoch checkpoints are saved to saved_models/ (symlinked to Drive).
resume: false
save_checkpoints: true

datasets_list:
  - ISOT
  - LIAR
  - WELFake

models_to_optimize:
  - dt
  - knn
  - lr
  - mnb
  - nb
  - rf
  - svm
  - xgb
  - lstm
  - gru
  - bilstm
  - cnn
  - bert
  - roberta
  - fakebert
  - distilbert

embeddings_to_use:
  - tfidf
  - bow
  - glove
  - word2vec
  - bert-base-uncased
  - roberta-base
  - distilbert-base-uncased

# Default models
models:
  name: svm
  dt:
    max_depth: 5
    min_samples_split: 2
    optuna:
      max_depth:
        type: int
        low: 3
        high: 12
      min_samples_split:
        type: int
        low: 2
        high: 10

  knn:
    n_neighbors: 5
    optuna:
      n_neighbors:
        type: int
        low: 1
        high: 20

  lr:
    C: 1.0
    max_iter: 1000
    solver: lbfgs
    optuna:
      C:
        type: float
        low: 0.001
        high: 100
        log: true

  mnb:
    alpha: 1.0
    optuna:
      alpha:
        type: float
        low: 0.001
        high: 10
        log: true

  nb:
    var_smoothing: 1.0e-9
    optuna:
      var_smoothing:
        type: float
        low: 1.0e-12
        high: 1.0e-3
        log: true

  rf:
    n_estimators: 100
    max_depth: 5
    optuna:
      n_estimators:
        type: int
        low: 50
        high: 300
      max_depth:
        type: int
        low: 3
        high: 12

  svm:
    C: 1.0
    max_iter: 5000
    dual: auto
    optuna:
      C:
        type: float
        low: 0.1
        high: 100
        log: true
      max_iter:
        type: int
        low: 1000
        high: 10000

  xgb:
    max_depth: 5
    learning_rate: 0.1
    n_estimators: 100
    tree_method: hist
    n_jobs: -1
    optuna:
      max_depth:
        type: int
        low: 3
        high: 12
      learning_rate:
        type: float
        low: 0.01
        high: 0.3
        log: true
      n_estimators:
        type: int
        low: 50
        high: 300

  lstm:
    hidden_size: 128
    num_layers: 1
    dropout: 0.3
    num_epochs: 5
    batch_size: 32
    learning_rate: 1.0e-3
    max_seq_len: 200
    embedding_dim: 100
    optuna:
      hidden_size:
        type: categorical
        choices: [64, 128, 256]
      num_layers:
        type: int
        low: 1
        high: 2
      dropout:
        type: float
        low: 0.1
        high: 0.5
      learning_rate:
        type: float
        low: 1.0e-4
        high: 1.0e-2
        log: true
      batch_size:
        type: categorical
        choices: [32, 64]
      num_epochs:
        type: int
        low: 3
        high: 8

  gru:
    hidden_size: 128
    num_layers: 1
    dropout: 0.3
    num_epochs: 5
    batch_size: 32
    learning_rate: 1.0e-3
    max_seq_len: 200
    embedding_dim: 100
    optuna:
      hidden_size:
        type: categorical
        choices: [64, 128, 256]
      num_layers:
        type: int
        low: 1
        high: 2
      dropout:
        type: float
        low: 0.1
        high: 0.5
      learning_rate:
        type: float
        low: 1.0e-4
        high: 1.0e-2
        log: true
      batch_size:
        type: categorical
        choices: [32, 64]
      num_epochs:
        type: int
        low: 3
        high: 8

  bilstm:
    hidden_size: 128
    num_layers: 1
    dropout: 0.3
    num_epochs: 5
    batch_size: 32
    learning_rate: 1.0e-3
    max_seq_len: 200
    embedding_dim: 100
    optuna:
      hidden_size:
        type: categorical
        choices: [64, 128, 256]
      num_layers:
        type: int
        low: 1
        high: 2
      dropout:
        type: float
        low: 0.1
        high: 0.5
      learning_rate:
        type: float
        low: 1.0e-4
        high: 1.0e-2
        log: true
      batch_size:
        type: categorical
        choices: [32, 64]
      num_epochs:
        type: int
        low: 3
        high: 8

  cnn:
    num_filters: 128
    kernel_sizes: [2, 3, 4]
    dropout: 0.3
    num_epochs: 5
    batch_size: 32
    learning_rate: 1.0e-3
    max_seq_len: 200
    embedding_dim: 100
    optuna:
      num_filters:
        type: categorical
        choices: [64, 128, 256]
      dropout:
        type: float
        low: 0.1
        high: 0.5
      learning_rate:
        type: float
        low: 1.0e-4
        high: 1.0e-2
        log: true
      batch_size:
        type: categorical
        choices: [32, 64]
      num_epochs:
        type: int
        low: 3
        high: 8

  bert:
    learning_rate: 2.0e-5
    num_epochs: 3
    batch_size: 16
    max_length: 256
    weight_decay: 0.01
    warmup_ratio: 0.1
    gradient_accumulation_steps: 2
    scheduler_type: linear
    classifier_dropout: 0.1
    freeze_layers: 0
    fp16: true
    save_checkpoints: true
    num_workers: 2
    optuna:
      learning_rate:
        type: float
        low: 1.0e-5
        high: 5.0e-5
        log: true
      num_epochs:
        type: int
        low: 2
        high: 5
      batch_size:
        type: categorical
        choices: [16, 32]
      max_length:
        type: categorical
        choices: [128, 256, 512]
      weight_decay:
        type: float
        low: 0.0
        high: 0.1
      warmup_ratio:
        type: float
        low: 0.0
        high: 0.2
      gradient_accumulation_steps:
        type: categorical
        choices: [1, 2, 4]
      scheduler_type:
        type: categorical
        choices: [linear, cosine]
      classifier_dropout:
        type: float
        low: 0.0
        high: 0.3
      freeze_layers:
        type: int
        low: 0
        high: 8

  roberta:
    learning_rate: 2.0e-5
    num_epochs: 3
    batch_size: 16
    max_length: 256
    weight_decay: 0.01
    warmup_ratio: 0.1
    gradient_accumulation_steps: 2
    scheduler_type: linear
    classifier_dropout: 0.1
    freeze_layers: 0
    fp16: true
    save_checkpoints: true
    num_workers: 2
    optuna:
      learning_rate:
        type: float
        low: 1.0e-5
        high: 5.0e-5
        log: true
      num_epochs:
        type: int
        low: 2
        high: 5
      batch_size:
        type: categorical
        choices: [16, 32]
      max_length:
        type: categorical
        choices: [128, 256, 512]
      weight_decay:
        type: float
        low: 0.0
        high: 0.1
      warmup_ratio:
        type: float
        low: 0.0
        high: 0.2
      gradient_accumulation_steps:
        type: categorical
        choices: [1, 2, 4]
      scheduler_type:
        type: categorical
        choices: [linear, cosine]
      classifier_dropout:
        type: float
        low: 0.0
        high: 0.3
      freeze_layers:
        type: int
        low: 0
        high: 8

  fakebert:
    learning_rate: 2.0e-5
    num_epochs: 3
    batch_size: 16
    max_length: 256
    weight_decay: 0.01
    warmup_ratio: 0.1
    gradient_accumulation_steps: 2
    scheduler_type: linear
    classifier_dropout: 0.1
    freeze_layers: 0
    fp16: true
    save_checkpoints: true
    num_workers: 2
    optuna:
      learning_rate:
        type: float
        low: 1.0e-5
        high: 5.0e-5
        log: true
      num_epochs:
        type: int
        low: 2
        high: 5
      batch_size:
        type: categorical
        choices: [16, 32]
      max_length:
        type: categorical
        choices: [128, 256, 512]
      weight_decay:
        type: float
        low: 0.0
        high: 0.1
      warmup_ratio:
        type: float
        low: 0.0
        high: 0.2
      gradient_accumulation_steps:
        type: categorical
        choices: [1, 2, 4]
      scheduler_type:
        type: categorical
        choices: [linear, cosine]
      classifier_dropout:
        type: float
        low: 0.0
        high: 0.3
      freeze_layers:
        type: int
        low: 0
        high: 8

  distilbert:
    learning_rate: 2.0e-5
    num_epochs: 3
    batch_size: 16
    max_length: 256
    weight_decay: 0.01
    warmup_ratio: 0.1
    gradient_accumulation_steps: 2
    scheduler_type: linear
    classifier_dropout: 0.1
    freeze_layers: 0
    fp16: true
    save_checkpoints: true
    num_workers: 2
    optuna:
      learning_rate:
        type: float
        low: 1.0e-5
        high: 5.0e-5
        log: true
      num_epochs:
        type: int
        low: 2
        high: 5
      batch_size:
        type: categorical
        choices: [16, 32]
      max_length:
        type: categorical
        choices: [128, 256, 512]
      weight_decay:
        type: float
        low: 0.0
        high: 0.1
      warmup_ratio:
        type: float
        low: 0.0
        high: 0.2
      gradient_accumulation_steps:
        type: categorical
        choices: [1, 2, 4]
      scheduler_type:
        type: categorical
        choices: [linear, cosine]
      classifier_dropout:
        type: float
        low: 0.0
        high: 0.3
      freeze_layers:
        type: int
        low: 0
        high: 4

embeddings:
  name: tfidf

preprocessing:
  name: classic

datasets:
  name: ISOT

# Optuna config
optuna:
  n_trials: 10
  n_trials_transformer: 10
  n_trials_dl: 8
  n_jobs: 2
  timeout: null
  sampler: tpe
  pruner: median

# MLflow config
mlflow:
  tracking_uri: sqlite:///mlflow.db
  experiment_name: fake_news_detection

# Web scraping
web_scraping:
  enabled: true
  use_simulated_data: false  # Use simulated data for demo
  num_real_samples: 5000
  num_fake_samples: 5000
  output_dir: "research/configs/web_scraped_data"
  processed_dir: "research/configs/web_scraped_data/processed"
  scrape_full_articles: true  # Also fetch full article body from each URL
  filename: "web_scraped_news.csv"
  text_types:
    - title
    - text
    - short_text

# Web testing
web_testing:
  enabled: true
  test_all_trained_models: true
  results_dir: "./experiments/web_test_results"
