defaults:
  - _self_

seed: 42
base_data_dir: "research/configs/datasets/processed"

datasets_list:
  - isot
  - liar
  - welfake

models_to_optimize:
  - dt
  - knn
  - lr
  - mnb
  - nb
  - rf
  - svm
  - xgb

embeddings_to_use:
  - tfidf
  - bow
  - glove
  - word2vec

# Default models
models:
  name: svm
  dt:
    max_depth: 5
    min_samples_split: 2
    optuna:
      max_depth:
        type: int
        low: 3
        high: 12
      min_samples_split:
        type: int
        low: 2
        high: 10

  knn:
    n_neighbors: 5
    optuna:
      n_neighbors:
        type: int
        low: 1
        high: 20

  lr:
    C: 1.0
    max_iter: 1000
    solver: lbfgs
    optuna:
      C:
        type: float
        low: 0.001
        high: 100
        log: true

  mnb:
    alpha: 1.0
    optuna:
      alpha:
        type: float
        low: 0.001
        high: 10
        log: true

  nb:
    var_smoothing: 1.0e-9
    optuna:
      var_smoothing:
        type: float
        low: 1.0e-12
        high: 1.0e-3
        log: true

  rf:
    n_estimators: 100
    max_depth: 5
    optuna:
      n_estimators:
        type: int
        low: 50
        high: 300
      max_depth:
        type: int
        low: 3
        high: 12

  svm:
    C: 1.0
    max_iter: 5000
    dual: auto
    optuna:
      C:
        type: float
        low: 0.1
        high: 100
        log: true
      max_iter:
        type: int
        low: 1000
        high: 10000

  xgb:
    max_depth: 5
    learning_rate: 0.1
    n_estimators: 100
    tree_method: auto
    optuna:
      max_depth:
        type: int
        low: 3
        high: 12
      learning_rate:
        type: float
        low: 0.01
        high: 0.3
        log: true
      n_estimators:
        type: int
        low: 50
        high: 300

embeddings:
  name: tfidf

preprocessing:
  name: classic

datasets:
  name: ISOT

# Optuna config
optuna:
  n_trials: 10
  n_jobs: 2
  timeout: null
  sampler: tpe
  pruner: median

# MLflow config
mlflow:
  tracking_uri: sqlite:///mlflow.db
  experiment_name: fake_news_detection

# Web scraping
web_scraping:
  enabled: true
  use_simulated_data: false  # Use simulated data for demo
  num_real_samples: 5000
  num_fake_samples: 5000
  output_dir: "research/configs/web_scraped_data"

# Web testing
web_testing:
  enabled: true
  test_all_trained_models: true
  results_dir: "./experiments/web_test_results"
