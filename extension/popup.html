<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fake News Detector</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
</head>
<body>
    
    <header>
        <img src="icon.png" alt="Logo" class="logo">
        <h1>Fake News Detector</h1>
    </header>

    <main class="container">
        
        <div class="status-box" id="statusBox">Select text on the page to verify credibility.</div>

        <button id="analyzeBtn">Analyze Selection</button>

        <div id="resultArea" class="result-card hidden">
            <div class="result-header">
                <span class="label" id="predictionLabel">--</span>
            </div>
            
            <div class="result-body">
                <div class="metric">
                    <span class="metric-label">Confidence</span>
                    <span class="metric-value" id="confidenceScore">0%</span>
                </div>
                <div class="progress-bg">
                    <div class="progress-fill" id="confidenceBar" style="width: 0%"></div>
                </div>
                
                <div class="model-info">
                    Model: <span id="modelName">--</span>
                </div>
            </div>
        </div>
        
        <div id="errorMsg" class="error hidden"></div>
    </main>

    <script src="popup.js"></script>
</body>
</html>
